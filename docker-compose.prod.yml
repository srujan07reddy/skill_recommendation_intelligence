# Production Docker Compose Orchestration for SSIP (TASK-10-03)
# Traceability: DEPLOYMENT.md §5.3, SYSTEM_ARCHITECTURE.md §4

version: '3.8'

services:
  # Persistent Academic Structure & User Identity Store (Boundary 2)
  postgres:
    image: postgres:16-alpine
    container_name: ssip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssip_prod}
      POSTGRES_USER: ${POSTGRES_USER:-ssip_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeProdSecret123!}
    volumes:
      - ssip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssip_admin} -d ${POSTGRES_DB:-ssip_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssip-network

  # Volatile Ephemeral Session Buffer with TTL Eviction (Boundary 3)
  redis:
    image: redis:7-alpine
    container_name: ssip-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - ssip-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ssip-network

  # SSIP FastAPI Analytical Engine Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssip-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_NAME: "Student Skill Intelligence Platform"
      APP_VERSION: "1.0.0"
      API_V1_PREFIX: /api/v1
      SECRET_KEY: ${SECRET_KEY:-ProdCryptographicSecretMustBeSetInEnvFile}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ssip_admin}:${POSTGRES_PASSWORD:-ChangeMeProdSecret123!}@postgres:5432/${POSTGRES_DB:-ssip_prod}
      REDIS_URL: redis://redis:6379/0
      SESSION_CACHE_TYPE: redis
      CORS_ORIGINS: "https://ssip.jeppiaar.edu.in,http://localhost"
      MAX_UPLOAD_SIZE_MB: 20
      SESSION_RETENTION_HOURS: 24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ssip-network

  # SSIP React 18 / Vite Static Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssip-frontend
    restart: unless-stopped
    networks:
      - ssip-network

  # Nginx Gateway Reverse Proxy (SSL Termination & Rate Limiting)
  nginx:
    image: nginx:1.25-alpine
    container_name: ssip-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend
    networks:
      - ssip-network

volumes:
  ssip-pgdata:
    driver: local
  ssip-redisdata:
    driver: local
  certbot-www:
    driver: local
  certbot-conf:
    driver: local

networks:
  ssip-network:
    driver: bridge

